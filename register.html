<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Ideathon 2026</title>
<meta name="robots" content="noindex">
<!-- Registration is collected by a Google Form. This page exists so links
     already shared keep working; it forwards without JavaScript too. -->
<meta http-equiv="refresh" content="0; url=https://docs.google.com/forms/d/e/1FAIpQLSeY4YYJUSAiQGr3_nyuRsarTzhUD1V4W2BIgDprQHytgmF_pg/viewform">
<link rel="canonical" href="https://docs.google.com/forms/d/e/1FAIpQLSeY4YYJUSAiQGr3_nyuRsarTzhUD1V4W2BIgDprQHytgmF_pg/viewform">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fbfbf9'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23202080' stroke-width='2.5'/%3E%3Cpath d='M16 10v6l4 2' stroke='%23202080' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<main id="main">
  <section class="band band-last">
    <div class="wrap wrap-narrow" style="text-align:center;padding-top:8vh">
      <h1>Taking you to the registration form…</h1>
      <p class="lede" style="margin-left:auto;margin-right:auto">
        Registration is on a Google Form. If nothing happens in a moment, use the button.
      </p>
      <p>
        <a class="btn btn-primary" id="formLink" rel="noopener"
           href="https://docs.google.com/forms/d/e/1FAIpQLSeY4YYJUSAiQGr3_nyuRsarTzhUD1V4W2BIgDprQHytgmF_pg/viewform">
          Open the registration form
        </a>
      </p>
      <p class="fine-print">
        <a href="index.html">Back to the event page</a> ·
        <a href="rulebook.html">Read the rule book first</a>
      </p>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script>
  /* Keep the destination in one place: if config changes, this follows. */
  (function () {
    var cfg = (window.IDEATHON || {}).config || {};
    var url = cfg.registrationUrl;
    if (!url) return;
    var link = document.getElementById('formLink');
    if (link) link.href = url;
    if (link && link.href !== location.href) location.replace(url);
  })();
</script>
</body>
</html>
